<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Organization Login - Smart Lab Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0a0e27; color: white; }
        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-color: rgba(255, 255, 255, 0.2); }
        .form-control { background-color: rgba(0,0,0,0.2); color: white; border-color: rgba(255,255,255,0.3); }
        .form-label { color: #fff; }
        a, a:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4" style="width: 100%; max-width: 400px; color: white;">
            <h2 class="text-center mb-4">Organization Admin Login</h2>
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
            <form id="orgLoginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Admin Username</label>
                    <input type="text" class="form-control" id="username" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="/org-register">Don't have an organization? Register one</a>
            </div>
            <div class="text-center mt-2">
                <a href="/" class="small">&larr; Back to main selection</a>
            </div>
        </div>
    </div>
<script>
    document.getElementById("orgLoginForm").addEventListener("submit", async function (event) {
        event.preventDefault();
        const errorMessage = document.getElementById("error-message");
        
        const formData = new FormData();
        formData.append("username", document.getElementById("username").value);
        formData.append("password", document.getElementById("password").value);

        try {
            // Call the new /org-token endpoint
            const response = await fetch("/org-token", {
              method: "POST",
              body: formData,
            });
            if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.detail || "Login failed");
            }
            const data = await response.json();
            localStorage.setItem("accessToken", data.access_token);
            // Redirect to the admin panel after successful login
            window.location.href = "/admin";
        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.classList.remove("d-none");
        }
      });
</script>
</body>
</html>
