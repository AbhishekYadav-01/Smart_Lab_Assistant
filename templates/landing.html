<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome - Smart Lab Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0e27;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
.card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 2rem;
            transition: transform 0.3s ease;
            color: #fff; /* <-- ADD THIS LINE */
        }
        a, a:hover {
            text-decoration: none;
            color: inherit; /* <-- ADD THIS RULE */
        }
        .card:hover {
            transform: translateY(-10px);
        }
        .card h3 {
            font-weight: 600;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">Welcome to the Smart Lab Assistant</h1>
        <p class="lead mb-5">The intelligent platform for managing and scheduling your organization's labs.</p>
        <div class="row g-4">
            <div class="col-md-6">
                <a href="/org-login">
                    <div class="card">
                        <h3>Manage an Organization</h3>
                        <p>Login or register your organization to manage labs and users.</p>
                    </div>
                </a>
            </div>
            <div class="col-md-6">
                <a href="/login">
                    <div class="card">
                        <h3>Join an Organization</h3>
                        <p>Login or register as a student or teacher within an existing organization.</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
