<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Smart Lab Assistant</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- Bootstrap (kept) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
      :root{
        --bg-1: #071033;
        --bg-2: #0a0e27;
        --glass: rgba(255,255,255,0.06);
        --glass-2: rgba(255,255,255,0.04);
        --muted: rgba(255,255,255,0.82);
        --accent-a: #6ee7b7;
        --accent-b: #60a5fa;
        --radius: 12px;
      }

      html,body{
        height:100%;
        margin:0;
        font-family: 'Poppins', sans-serif;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        background:
          radial-gradient(800px 400px at 10% 20%, rgba(96,165,250,0.04), transparent 8%),
          radial-gradient(700px 350px at 90% 80%, rgba(110,231,183,0.03), transparent 5%),
          linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
        color:#fff;
      }

      /* page centering */
      .center-wrap {
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:1.5rem;
        box-sizing:border-box;
      }

      /* panel */
      .panel {
        width:100%;
        max-width:520px;
        border-radius: calc(var(--radius) + 6px);
        background: linear-gradient(180deg, var(--glass), var(--glass-2));
        border: 1px solid rgba(255,255,255,0.06);
        padding:1.6rem;
        box-shadow: 0 14px 50px rgba(2,6,23,0.6);
        position:relative;
        overflow:hidden;
      }

      /* accent stripe */
      .panel::after{
        content:'';
        position:absolute;
        left:-20%;
        top:-20%;
        width:160%;
        height:48%;
        background: linear-gradient(90deg, rgba(110,231,183,0.06), rgba(96,165,250,0.06));
        transform: rotate(12deg);
        pointer-events:none;
      }

      h2 {
        margin:0 0 .35rem 0;
        font-weight:600;
        color:#fff;
        font-size:1.3rem;
      }

      .sub {
        margin:0 0 1rem 0;
        color:var(--muted);
        font-weight:300;
      }

      /* inputs */
      .form-control, .form-select {
        background-color: rgba(0,0,0,0.22);
        color: white;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        padding: .68rem .9rem;
      }

      .form-control:focus, .form-select:focus {
        outline: none;
        box-shadow: 0 10px 30px rgba(96,165,250,0.12);
        border-color: rgba(96,165,250,0.85);
        background-color: rgba(0,0,0,0.14);
      }

      label.form-label { color:#fff; font-weight:500; }

      .btn-primary {
        border-radius: 10px;
        padding: .6rem .9rem;
        font-weight:600;
        background-image: linear-gradient(90deg, var(--accent-a), var(--accent-b));
        border: none;
        box-shadow: 0 10px 30px rgba(96,165,250,0.08);
      }

      /* links area */
      .links {
        margin-top:.85rem;
        display:flex;
        flex-direction:column;
        gap:.5rem;
        align-items:center;
      }
      .links a { color:#fff; text-decoration:none; font-size:.95rem; opacity:.96; }

      /* error */
      #error-message {
        margin-bottom: .9rem;
        border-radius:8px;
        padding:.6rem .85rem;
      }

      /* helper */
      .helper {
        font-size:.88rem;
        color: rgba(255,255,255,0.78);
        margin-top:.6rem;
        text-align:center;
      }

      /* responsive */
      @media (max-width:520px){
        .panel { padding:1.1rem; }
        h2 { font-size:1.12rem; }
      }

      /* reduced motion */
      @media (prefers-reduced-motion: reduce){
        * { transition:none !important; animation:none !important; }
      }
    </style>
  </head>
  <body>
    <div class="center-wrap">
      <div class="panel" role="form" aria-labelledby="member-login-title">
        <h2 id="member-login-title" class="text-center">Member Login</h2>
        <p class="sub text-center">Sign in to access your labs and schedule</p>

        <div id="error-message" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="organization" class="form-label">Organization</label>
            <select class="form-select" id="organization" required aria-required="true" aria-label="Select your organization">
                <option value="" disabled selected style="background-color: #071033;">Select your organization</option>
                {% for org in organizations %}
                <option value="{{ org.id }}" style="background-color: #071033;">{{ org.name }}</option>
                {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required autocomplete="username" inputmode="text" />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required autocomplete="current-password" />
          </div>

          <button id="submitBtn" type="submit" class="btn btn-primary w-100" aria-live="polite">
            <span id="btnText">Login</span>
            <span id="btnSpinner" class="visually-hidden" aria-hidden="true" style="margin-left:.5rem;">
              <!-- inline spinner -->
              <svg width="18" height="18" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
                <circle cx="25" cy="25" r="20" stroke="white" stroke-opacity="0.16" stroke-width="6"></circle>
                <path d="M45 25A20 20 0 1 1 25 5" stroke="white" stroke-width="6" stroke-linecap="round"></path>
              </svg>
            </span>
          </button>
        </form>

        <div class="links">
          <a href="/register" id="registerLink">Don't have an account? Register</a>
          <a href="/" class="small" id="backLink">&larr; Back to main selection</a>
        </div>

        <p class="helper">Tokens from a successful login are saved to localStorage and used for authenticated requests.</p>
      </div>
    </div>

    <script>
      (function () {
        const form = document.getElementById('loginForm');
        const errEl = document.getElementById('error-message');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        function showError(msg) {
          errEl.textContent = msg;
          errEl.classList.remove('d-none');
        }
        function clearError() {
          errEl.textContent = '';
          errEl.classList.add('d-none');
        }

        function validate() {
          const org = document.getElementById('organization').value;
          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;
          if (!org) return 'Please select your organization.';
          if (!username) return 'Please enter your username.';
          if (!password) return 'Please enter your password.';
          return '';
        }

        function setSubmitting(active) {
          if (active) {
            submitBtn.setAttribute('disabled', 'true');
            btnSpinner.classList.remove('visually-hidden');
            submitBtn.style.opacity = '0.95';
          } else {
            submitBtn.removeAttribute('disabled');
            btnSpinner.classList.add('visually-hidden');
            submitBtn.style.opacity = '';
          }
        }

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          clearError();

          const validationErr = validate();
          if (validationErr) {
            showError(validationErr);
            return;
          }

          setSubmitting(true);

          try {
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value.trim());
            formData.append('password', document.getElementById('password').value);
            // append organization scope as requested
            formData.append('scope', document.getElementById('organization').value);

            const resp = await fetch('/token', { method: 'POST', body: formData });

            if (!resp.ok) {
              let errMsg = 'Login failed';
              try {
                const errJson = await resp.json();
                if (errJson && errJson.detail) errMsg = errJson.detail;
                else if (errJson && errJson.error) errMsg = errJson.error;
              } catch (_) {
                if (resp.statusText) errMsg = resp.statusText;
              }
              throw new Error(errMsg);
            }

            const data = await resp.json();
            if (data && data.access_token) {
              try {
                localStorage.setItem('accessToken', data.access_token);
              } catch (storageErr) {
                console.warn('localStorage write failed', storageErr);
              }
              window.location.href = '/dashboard';
            } else {
              throw new Error('Login succeeded but no token returned.');
            }
          } catch (err) {
            showError(err.message || 'An unknown error occurred.');
          } finally {
            setSubmitting(false);
          }
        });

        // clear error on input
        ['organization','username','password'].forEach(id => {
          const el = document.getElementById(id);
          el.addEventListener('input', () => clearError());
        });
      })();
    </script>
  </body>
</html>
