<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Register - Smart Lab Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0a0e27; color: white; }
        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-color: rgba(255, 255, 255, 0.2); }
        .form-control, .form-select { background-color: rgba(0,0,0,0.2); color: white; border-color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4" style="width: 100%; max-width: 500px; color: white;">
            <h2 class="text-center mb-4">Create Member Account</h2>
            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="organization" class="form-label">Organization</label>
                    <select class="form-select" id="organization" required>
                        <option value="" disabled selected>Select your organization</option>
                        {% for org in organizations %}
                        <option value="{{ org.id }}" data-domain="{{ org.required_email_domain }}">{{ org.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="fullname" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullname" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                    <div id="email-domain-hint" class="form-text">Your email must match your organization's domain.</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" required>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login">Already have an account? Login</a>
            </div>
        </div>
    </div>
<script>
    const orgSelect = document.getElementById('organization');
    const emailInput = document.getElementById('email');
    const emailHint = document.getElementById('email-domain-hint');

    orgSelect.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        const domain = selectedOption.getAttribute('data-domain');
        if (domain) {
            emailHint.textContent = `Your email must end with @${domain}`;
        } else {
            emailHint.textContent = "Your email must match your organization's domain.";
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const errorMessage = document.getElementById('error-message');
        
        const selectedOrgOption = orgSelect.options[orgSelect.selectedIndex];
        const requiredDomain = selectedOrgOption.getAttribute('data-domain');
        const userEmail = emailInput.value;

        if (requiredDomain && !userEmail.endsWith(requiredDomain)) {
            errorMessage.textContent = `Registration failed: Your email must end with @${requiredDomain}.`;
            errorMessage.classList.remove('d-none');
            return;
        }

        const formData = {
            organization_id: parseInt(orgSelect.value),
            username: document.getElementById('username').value,
            full_name: document.getElementById('fullname').value,
            email: userEmail,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
        };

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData),
            });
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.detail || 'Registration failed');
            }
            window.location.href = '/login';
        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
