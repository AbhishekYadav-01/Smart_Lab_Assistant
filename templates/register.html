<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - Smart Lab Assistant</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-1: #071033;
      --bg-2: #0a0e27;
      --glass: rgba(255,255,255,0.06);
      --glass-2: rgba(255,255,255,0.04);
      --accent-a: #6ee7b7;
      --accent-b: #60a5fa;
      --muted: rgba(255,255,255,0.82);
      --radius: 14px;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(800px 400px at 10% 20%, rgba(96,165,250,0.05), transparent 8%),
        radial-gradient(700px 350px at 90% 80%, rgba(110,231,183,0.04), transparent 5%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .center-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: linear-gradient(180deg, var(--glass), var(--glass-2));
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      width: 100%;
      max-width: 520px;
      padding: 1.8rem;
      box-shadow: 0 14px 40px rgba(2,6,23,0.55);
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      top: -25%;
      left: -25%;
      width: 150%;
      height: 50%;
      background: linear-gradient(90deg, rgba(110,231,183,0.05), rgba(96,165,250,0.05));
      transform: rotate(15deg);
      pointer-events: none;
    }

    h2 {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .form-control, .form-select {
      background-color: rgba(0,0,0,0.25);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: .7rem .9rem;
    }

    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: rgba(96,165,250,0.85);
      box-shadow: 0 6px 22px rgba(96,165,250,0.12);
      background-color: rgba(0,0,0,0.18);
    }

    .form-label {
      color: #fff;
      font-weight: 500;
    }

    .form-text {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .btn-primary {
      border-radius: 10px;
      padding: .6rem;
      font-weight: 600;
      background-image: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      border: none;
      box-shadow: 0 8px 26px rgba(96,165,250,0.08);
      transition: all 0.25s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 34px rgba(96,165,250,0.12);
    }

    .alert {
      border-radius: 8px;
      padding: .65rem .9rem;
    }

    a, a:hover {
      color: #fff;
      text-decoration: none;
    }

    .link-area {
      text-align: center;
      margin-top: 1rem;
    }

    @media (max-width: 520px) {
      .card { padding: 1.2rem; }
      h2 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="center-wrap">
    <div class="card">
      <h2>Create Member Account</h2>
      <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="organization" class="form-label">Organization</label>
          <select class="form-select" id="organization" required>
            <option value="" disabled selected>Select your organization</option>
            {% for org in organizations %}
            <option value="{{ org.id }}" data-domain="{{ org.required_email_domain }}">{{ org.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" required>
        </div>

        <div class="mb-3">
          <label for="fullname" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="fullname" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" required>
          <div id="email-domain-hint" class="form-text">
            Your email must match your organization's domain.
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required>
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">Role</label>
          <select class="form-select" id="role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>
      </form>

      <div class="link-area">
        <a href="/login">Already have an account? Login</a>
      </div>
    </div>
  </div>

  <script>
    const orgSelect = document.getElementById('organization');
    const emailInput = document.getElementById('email');
    const emailHint = document.getElementById('email-domain-hint');
    const errorMessage = document.getElementById('error-message');

    orgSelect.addEventListener('change', function() {
      const selectedOption = this.options[this.selectedIndex];
      const domain = selectedOption.getAttribute('data-domain');
      if (domain) {
        emailHint.textContent = `Your email must end with @${domain}`;
      } else {
        emailHint.textContent = "Your email must match your organization's domain.";
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      errorMessage.classList.add('d-none');

      const selectedOrgOption = orgSelect.options[orgSelect.selectedIndex];
      const requiredDomain = selectedOrgOption.getAttribute('data-domain');
      const userEmail = emailInput.value.trim();

      if (requiredDomain && !userEmail.endsWith(requiredDomain)) {
        errorMessage.textContent = `Registration failed: Your email must end with @${requiredDomain}.`;
        errorMessage.classList.remove('d-none');
        return;
      }

      const formData = {
        organization_id: parseInt(orgSelect.value),
        username: document.getElementById('username').value.trim(),
        full_name: document.getElementById('fullname').value.trim(),
        email: userEmail,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
      };

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData),
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.detail || 'Registration failed');
        }

        window.location.href = '/login';
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
